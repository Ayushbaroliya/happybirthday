<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

body{
margin:0;
font-family:sans-serif;
text-align:center;
color:white;
overflow:hidden;

/* classy animated bg */

background:linear-gradient(-45deg,#ff4e50,#ff0080,#8e2de2,#4a00e0);
background-size:400% 400%;
animation:bgMove 10s infinite linear;
}

.after{
background:linear-gradient(-45deg,#141e30,#243b55,#000000,#434343);
background-size:400% 400%;
animation:bgMove 12s infinite linear;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
padding:20px;
position:relative;
z-index:2;
}

h1{
font-size:26px;
text-shadow:0 0 10px white;
}

button{
padding:15px 25px;
font-size:18px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#ff0080,#ff4e50);
color:white;
margin-top:20px;
box-shadow:0 0 10px white;
}

/* curtain */

#curtain{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
z-index:5;
}

.panel{
position:absolute;
top:0;
width:50%;
height:100%;
background:linear-gradient(#4b0000,#8b0000);
transition:1.5s;
}

.left{left:0;}
.right{right:0;}

.open .left{
transform:translateX(-100%);
}

.open .right{
transform:translateX(100%);
}

/* photo */

#photoBox{
display:none;
margin-top:20px;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

img{
width:80%;
max-width:320px;
border-radius:20px;
box-shadow:0 0 25px white;
}

/* flowers */

.petal{
position:fixed;
top:-30px;
font-size:20px;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0.9;
}
}

</style>
</head>

<body>

<div id="curtain">
<div class="panel left"></div>
<div class="panel right"></div>
</div>

<div class="container" id="mainBox">

<h1 id="title">🎂 Happy Birthday Shreya 🎂</h1>

<p id="msg">A surprise is waiting ✨</p>

<button id="btn" onclick="magic()">🎁 Open Surprise</button>

<div id="photoBox">

<img src="assets/shreya.jpeg">

<h2 id="afterText">😊stay healthy stay happy 💖</h2>

</div>

</div>

<audio id="music">
<source src="assets/birthday_salsa.mp3" type="audio/mpeg">
</audio>

<script>

function magic(){

let curtain=document.getElementById("curtain");
let music=document.getElementById("music");

let btn=document.getElementById("btn");
let title=document.getElementById("title");
let msg=document.getElementById("msg");


// hide intro text

btn.style.display="none";
msg.style.display="none";
title.style.display="none";


// show curtain

curtain.style.display="block";


// play music

music.currentTime=0;
music.play().catch(()=>{});


// open curtain

setTimeout(()=>{
curtain.classList.add("open");
document.body.classList.add("after");
},500);


// show photo

setTimeout(()=>{
document.getElementById("photoBox").style.display="block";
},1700);


// classy petals

let flowers=["🌸","💮","✨","❀","✿","💖"];

for(let i=0;i<60;i++){

let p=document.createElement("div");

p.innerHTML=flowers[Math.floor(Math.random()*flowers.length)];

p.className="petal";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=(4+Math.random()*3)+"s";

p.style.fontSize=(16+Math.random()*10)+"px";

document.body.appendChild(p);

}

}
</script>

</body>
</html>
